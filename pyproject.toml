[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalkit"
version = "0.1.0"
description = "Statistically rigorous evaluation for LLM systems."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "statsmodels",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["evalkit*"]

[tool.pytest.ini_options]
markers = [
    "validation: slow simulation studies; excluded by default, run explicitly with -m validation",
]
addopts = "-m \"not validation\""
